# Checks: the release's own checks on every push to main and every pull request, so a change
# that would stop a release shows up when it lands rather than when a tag is cut. The work is one
# command, `npm run verify`, which is also what a person or an agent runs before pushing; the list
# of checks lives in tools/verify.mjs rather than here.
#
# Linux because it is the quickest runner, and Windows because that is where test failures have
# held a release back before. The release workflow still checks all three before it publishes.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer moot.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      # The same prerequisites the release installs; see release.yml.
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                                  build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: verify-${{ matrix.os }}
          cache-on-failure: true

      - run: npm ci

      # The release's CI settings, for the release's reasons (see release.yml): a fresh runner has
      # no last build to be incremental against, and line tables are all a test failure needs.
      - name: npm run verify
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 1
        run: npm run verify
